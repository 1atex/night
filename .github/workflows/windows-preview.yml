name: Windows preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*-preview.*"]
    paths:
      - "src/night/**"
      - "config/**"
      - "scripts/preview/**"
      - "tests/native/**"
      - "tests/night/**"
      - ".github/workflows/windows-preview.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Night modules
        run: npm run test:night
      - name: Install test dependencies
        run: python -m pip install -r tests/native/requirements.txt
      - name: Download pinned native runtime
        run: |
          $pin = Get-Content scripts/preview/runtime.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP "firefox-upstream.exe"
          Invoke-WebRequest -Uri $pin.windows_x64.url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $pin.windows_x64.sha256) {
            throw "Upstream checksum mismatch"
          }
          7z x -y "-o$env:RUNNER_TEMP\firefox-upstream" $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble Night preview
        run: |
          python scripts/preview/package.py --runtime "$env:RUNNER_TEMP/firefox-upstream/core" --output dist/Night --archive "$env:RUNNER_TEMP/firefox-upstream.exe" --platform windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $source = (Resolve-Path scripts/preview/Launcher.cs).Path
          $updateSource = (Resolve-Path scripts/preview/UpdateRunner.cs).Path
          $importSource = (Resolve-Path scripts/preview/ProfileImport.cs).Path
          $executable = Join-Path (Resolve-Path dist/Night).Path "Night.exe"
          $icon = (Resolve-Path src/night/branding/night.ico).Path
          & $csc /nologo /target:winexe /platform:x64 /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/win32icon:$icon" "/out:$executable" $source $importSource $updateSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build per-user installer
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler scripts/preview/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test first-run setup and window controls
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/onboarding.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/installer.py --setup dist/night-browser-0.18.3-preview-windows-x64-setup.exe --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test stale startup cache recovery
        run: |
          python -u tests/native/startup_cache.py --package dist/Night --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged browser on Windows
        run: |
          New-Item -ItemType Directory -Force test-artifacts | Out-Null
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/smoke.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --preview --screenshot test-artifacts/preview.png --log test-artifacts/gecko.log 2>&1 | Tee-Object -FilePath test-artifacts/native-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test private windows and Mozilla account connection
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/accounts.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test updates and friends service
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/updates_together.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release feed and asset digests
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/updater_feed.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test two-browser video synchronization
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/watch.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test invite approval and peer chat and voice
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/social.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/social.py --delayed-scripts --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts/delayed-room
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test encrypted friend notices and browser imports
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/notices.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/import_browsers.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test player broadcast and viewer controls
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/broadcast.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test split navigation and interface details
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/split_navigation.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/ux_details.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test personal home links and gradients
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/home_personalization.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated Windows profiles
        run: |
          python -u tests/native/profiles.py --package dist/Night --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test start page and last-tab behavior
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/start_flow.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test home suggestions and address transitions
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/search.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test home widgets, compact address and native surfaces
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/home_ux.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/surfaces.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Night product and session restoration
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/product.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/product-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Night settings and layout
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/settings.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/settings-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/motion.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/motion-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/chrome.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/chrome-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test folders, resize and background restoration
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/sidebar.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/sidebar-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/saved_tabs.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test configurable process reserve
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/preallocation.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/preallocation-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect ordinary first launch and Windows identity
        run: ./tests/native/first-launch.ps1 -Package dist/Night -Output test-artifacts
      - name: Test migration from an actual Zen profile
        run: |
          ./tests/native/import-transaction.ps1 -Launcher dist/Night/Night.exe
          $fixtures = Get-Content tests/native/import-fixtures.json -Raw | ConvertFrom-Json
          $zen = Join-Path $env:RUNNER_TEMP "zen-import.exe"
          $extension = Join-Path $env:RUNNER_TEMP "import-extension.xpi"
          Invoke-WebRequest $fixtures.zen.url -OutFile $zen
          Invoke-WebRequest $fixtures.extension.url -OutFile $extension
          if ((Get-FileHash $zen -Algorithm SHA256).Hash.ToLower() -ne $fixtures.zen.sha256) { throw "Zen fixture checksum mismatch" }
          if ((Get-FileHash $extension -Algorithm SHA256).Hash.ToLower() -ne $fixtures.extension.sha256) { throw "Extension fixture checksum mismatch" }
          7z x -y "-o$env:RUNNER_TEMP/zen-import" $zen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/zen_import.py --package dist/Night --zen "$env:RUNNER_TEMP/zen-import/core/zen.exe" --extension $extension --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/zen-import-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure minimized browser memory
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/memory.py --stock "$env:RUNNER_TEMP/firefox-upstream/core/firefox.exe" --night "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts 2>&1 | Tee-Object -FilePath test-artifacts/memory-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test portable launcher
        run: python -u tests/native/launcher.py --launcher dist/Night/Night.exe
      - name: Measure page rendering and sidebar work
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/rendering.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --output test-artifacts --optimized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read Island revision
        id: island-pin
        run: |
          $pin = Get-Content scripts/preview/island.json -Raw | ConvertFrom-Json
          "revision=$($pin.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: 1atex/night-island
          ref: ${{ steps.island-pin.outputs.revision }}
          fetch-depth: 0
          path: test-island
      - name: Verify Island foundation
        run: |
          $pin = Get-Content scripts/preview/island.json -Raw | ConvertFrom-Json
          git -C test-island merge-base --is-ancestor $pin.foundation HEAD
          if ($LASTEXITCODE -ne 0) { throw "Island does not include the required foundation" }
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test-island -> target
          cache-on-failure: true
      - name: Build Island integration fixture
        run: cargo build --manifest-path test-island/Cargo.toml --locked --features demo --bin night-island
      - name: Test actual Island download controls
        run: |
          $output = (Resolve-Path dist/Night).Path
          python -u tests/native/island.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --island test-island/target/debug/night-island.exe --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/native/island_hub.py --binary "$output/runtime/NightBrowser.exe" --app-ini "$output/runtime/browser/application.ini" --island test-island/target/debug/night-island.exe --output test-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable archive
        run: |
          7z a -tzip dist/night-browser-0.18.3-preview-windows-x64.zip ./dist/Night
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested downloads
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-windows-x64-preview
          path: |
            dist/night-browser-0.18.3-preview-windows-x64.zip
            dist/night-browser-0.18.3-preview-windows-x64-setup.exe
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-tests
          path: test-artifacts/
          retention-days: 14

  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:night
      - run: python3 -m unittest discover -s tests/preview
      - run: bash tests/server/docker.sh
      - run: bash tests/server/nginx.sh
      - run: python3 tests/server/turn.py

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preview, server-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: night-browser-windows-x64-preview
          path: release-assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/preview/publish.py --repository "$GH_REPO" --tag "$RELEASE_TAG" --assets release-assets --notes docs/night/PREVIEW_RELEASE.md
