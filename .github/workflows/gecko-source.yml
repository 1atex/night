name: Gecko source candidate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Jobs to run
        type: choice
        options: [all, baseline, source, configure]
        default: all

permissions:
  contents: read

jobs:
  windows-baseline:
    if: inputs.phase == 'baseline' || inputs.phase == 'all'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare matched Firefox and Night
        run: |
          $pin = Get-Content scripts/preview/runtime.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP firefox.exe
          curl.exe --fail --location --retry 3 --silent --show-error $pin.windows_x64.url --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.windows_x64.sha256) { throw "Firefox checksum mismatch" }
          7z x -y "-o$env:RUNNER_TEMP/firefox" $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/preview/package.py --runtime "$env:RUNNER_TEMP/firefox/core" --archive $installer --platform windows_x64 --output dist/Night
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stockHash = (Get-FileHash "$env:RUNNER_TEMP/firefox/core/xul.dll").Hash
          if ((Get-FileHash dist/Night/runtime/xul.dll).Hash -ne $stockHash) { throw "The baseline must use the same engine" }
      - name: Measure active, minimized and video workloads
        run: |
          python -m pip install -r tests/native/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = (Resolve-Path dist/Night/runtime).Path
          python tests/native/memory.py --stock "$env:RUNNER_TEMP/firefox/core/firefox.exe" --night "$runtime/NightBrowser.exe" --app-ini "$runtime/browser/application.ini" --output test-artifacts --profile-rendering
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-windows-baseline
          path: test-artifacts/

  windows-source:
    if: inputs.phase != 'baseline'
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MOZILLABUILD: C:\mozilla-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check runner resources
        run: |
          $runnerTemp = $env:RUNNER_TEMP.Replace('\', '/')
          "NIGHT_GECKO_ROOT=$runnerTemp/gecko" >> $env:GITHUB_ENV
          "MOZBUILD_STATE_PATH=$runnerTemp/gecko-state" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, Used, Free
          Get-CimInstance Win32_ComputerSystem | Format-Table NumberOfLogicalProcessors, TotalPhysicalMemory
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw "Rust is missing" }
      - name: Cache Mozilla build toolchains
        uses: actions/cache@v4
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: gecko-windows-toolchains-${{ hashFiles('scripts/preview/runtime.json', 'scripts/gecko/windows.mozconfig') }}
      - name: Cache pinned source archive
        uses: actions/cache@v4
        with:
          path: ${{ env.NIGHT_GECKO_ROOT }}/source.tar.xz
          key: gecko-source-archive-${{ hashFiles('scripts/preview/runtime.json') }}
      - name: Cache compiled Gecko
        id: engine-cache
        if: inputs.phase != 'configure'
        uses: actions/cache@v4
        with:
          path: ${{ env.NIGHT_GECKO_ROOT }}/runtime/firefox
          key: gecko-windows-2025-x64-${{ hashFiles('scripts/preview/runtime.json', 'scripts/gecko/**') }}
      - name: Fetch and verify Gecko archive
        run: ./scripts/gecko/build-windows.ps1 -Phase archive
      - name: Install pinned MozillaBuild
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: ./scripts/gecko/build-windows.ps1 -Phase tools
      - name: Extract verified Gecko sources
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: ./scripts/gecko/build-windows.ps1 -Phase source
      - name: Configure pinned Gecko
        if: inputs.phase == 'configure'
        run: ./scripts/gecko/build-windows.ps1 -Phase configure
      - name: Compile pinned Gecko
        if: inputs.phase != 'configure' && steps.engine-cache.outputs.cache-hit != 'true'
        run: ./scripts/gecko/build-windows.ps1 -Phase build
      - name: Package candidate with Night
        if: inputs.phase != 'configure'
        run: |
          python scripts/preview/package.py --source-build --platform windows_x64 --archive "$env:NIGHT_GECKO_ROOT/source.tar.xz" --runtime "$env:NIGHT_GECKO_ROOT/runtime/firefox" --output dist/Night
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builtHash = (Get-FileHash "$env:NIGHT_GECKO_ROOT/runtime/firefox/xul.dll" -Algorithm SHA256).Hash
          if ((Get-FileHash dist/Night/runtime/xul.dll -Algorithm SHA256).Hash -ne $builtHash) { throw "Night does not contain the compiled Gecko binary" }
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $compiler /nologo /target:winexe /platform:x64 /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /win32icon:src/night/branding/night.ico /out:dist/Night/Night.exe scripts/preview/Launcher.cs scripts/preview/ProfileImport.cs scripts/preview/UpdateRunner.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check startup and browser behaviour
        if: inputs.phase != 'configure'
        run: |
          python -m pip install -r tests/native/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force test-artifacts | Out-Null
          $runtime = (Resolve-Path dist/Night/runtime).Path
          python tests/native/smoke.py --binary "$runtime/NightBrowser.exe" --app-ini "$runtime/browser/application.ini" --preview --log test-artifacts/source-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/native/memory.py --stock "$env:NIGHT_GECKO_ROOT/runtime/firefox/firefox.exe" --night "$runtime/NightBrowser.exe" --app-ini "$runtime/browser/application.ini" --output test-artifacts --profile-rendering
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive source candidate
        if: inputs.phase != 'configure'
        run: |
          7z a -tzip -mx=3 dist/night-gecko-source-windows-x64.zip ./dist/Night
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: inputs.phase != 'configure'
        with:
          name: night-gecko-source-windows-x64
          path: dist/night-gecko-source-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
      - name: Collect compiler logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force test-artifacts | Out-Null
          Get-ChildItem $env:NIGHT_GECKO_ROOT -Filter '*.log' -ErrorAction SilentlyContinue | Copy-Item -Destination test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-source-measurements
          path: test-artifacts/
